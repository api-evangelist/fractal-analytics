aid: fractal-analytics
name: Fractal Analytics
description: 'Fractal Analytics Limited (fractal.ai) is an enterprise artificial intelligence
  services and products company founded in 2000, headquartered in New York with a large
  delivery footprint in India and roughly 5,000 employees across 18 global locations.
  Fractal sells AI consulting, data engineering, decision-science and design services to
  Fortune 500 clients in consumer packaged goods, retail, healthcare and life sciences,
  technology/media/telecom, financial services, insurance and industrials, and builds
  products on top of that practice — most notably Cogentiq, its enterprise agentic AI
  platform (with MCP and agent gateways, low-code agent builder and pre-built domain
  agents), LLM Studio, and consumer/vertical brands including Flyfish, Asper.ai,
  Kalaido.ai, Vaidya.ai and iqigai. The company listed on the NSE and BSE under the
  symbol FRACTAL in February 2026. Its API surface is delivered inside client engagements
  and gated product tenants rather than through a public developer program: as of this
  profiling pass Fractal publishes no public developer portal, no OpenAPI or other
  machine-readable API contract, and no hosted MCP server or A2A agent card.'
